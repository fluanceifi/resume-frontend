name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (SHA 7자리)
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/fluanceifi/resume-frontend:${{ steps.tag.outputs.sha }}

      - name: Dispatch to infra repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_PAT }}
          repository: FluanceIFI/resume-infra
          event-type: deploy
          client-payload: |
            {
              "service": "frontend",
              "image_tag": "${{ steps.tag.outputs.sha }}",
              "actor": "${{ github.actor }}",
              "sha": "${{ github.sha }}"
            }
